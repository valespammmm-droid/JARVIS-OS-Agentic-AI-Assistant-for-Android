# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *take precedence* over any settings in this file.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmtoolchain=17
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr

# Use AndroidX libraries
android.useAndroidX=true

# Jetifier not needed — all dependencies are AndroidX
android.enableJetifier=false

# Kotlin styling
kotlin.code.style=official

# Non-transitive R classes reduce APK size and improve build speed
android.nonTransitiveRClass=true
